name: Inspect VPS Environment and Logs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS processes, ports, and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== PM2 Process Status ==="
            pm2 status || true

            echo "=== Listening Ports (3000, 5001, etc.) ==="
            ss -tulpn 2>/dev/null | grep -E ':(3000|5001|80|443)' || netstat -tulpn 2>/dev/null | grep -E ':(3000|5001|80|443)' || true

            echo "=== App Directories in /home/deployer/apps ==="
            ls -la /home/deployer/apps || true

            echo "=== Variable names in /home/deployer/apps/satmi-orders/.env.local ==="
            grep -E '^[A-Za-z0-9_]+=' /home/deployer/apps/satmi-orders/.env.local 2>/dev/null | cut -d= -f1 || echo "No .env.local yet"

            echo "=== PM2 logs (satmi-orders error) ==="
            pm2 logs satmi-orders --lines 50 --nostream --err || tail -n 50 /home/deployer/.pm2/logs/satmi-orders-error.log || true

            echo "=== PM2 logs (satmi-orders out) ==="
            pm2 logs satmi-orders --lines 30 --nostream --out || tail -n 30 /home/deployer/.pm2/logs/satmi-orders-out.log || true

            echo "=== Test Local Postgres Authentication with Node ==="
            cd /home/deployer/apps/satmi-orders
            node --env-file=.env.local -e '
              import postgres from "postgres";
              const sql = postgres(process.env.SUPABASE_DB_URL);
              async function run() {
                try {
                  console.log("Connected to DB:", process.env.SUPABASE_DB_URL.replace(/:[^:@]+@/, ":***@"));
                  const ext = await sql`SELECT extname FROM pg_extension WHERE extname = "pgcrypto"`;
                  console.log("pgcrypto extension:", ext);
                  const users = await sql`SELECT id, email, role, length(encrypted_password) as pass_len FROM auth_users`;
                  console.log("Users in auth_users:", users);
                  if (users.length > 0) {
                    const testEmail = users[0].email;
                    console.log("Testing crypt query for:", testEmail);
                    const res = await sql`
                      SELECT id, email, (encrypted_password = crypt($2, encrypted_password)) as match
                      FROM auth_users
                      WHERE LOWER(email) = LOWER($1)
                    `([testEmail, "wrongpassword"]);
                    console.log("Crypt query result:", res);
                  }
                } catch (e) {
                  console.error("Test error:", e);
                } finally {
                  await sql.end();
                }
              }
              run();
            '
