name: Inspect VPS Environment and Logs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS processes, ports, and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== PM2 Process Status ==="
            pm2 status || true

            echo "=== Listening Ports (3000, 5001, etc.) ==="
            ss -tulpn 2>/dev/null | grep -E ':(3000|5001|80|443)' || netstat -tulpn 2>/dev/null | grep -E ':(3000|5001|80|443)' || true

            echo "=== App Directories in /home/deployer/apps ==="
            ls -la /home/deployer/apps || true

            echo "=== Variable names in /home/deployer/apps/satmi-orders/.env.local ==="
            grep -E '^[A-Za-z0-9_]+=' /home/deployer/apps/satmi-orders/.env.local 2>/dev/null | cut -d= -f1 || echo "No .env.local yet"

            echo "=== Full satmi-orders-error-2.log ==="
            cat /home/deployer/logs/satmi-orders-error-2.log 2>/dev/null || true

            echo "=== Test Curl Local Endpoint http://127.0.0.1:5001/api/auth/sign-in ==="
            curl -v -X POST http://127.0.0.1:5001/api/auth/sign-in \
              -H "Content-Type: application/json" \
              -d '{"email":"kartavya@satmi.in","password":"wrongpassword"}' || true
