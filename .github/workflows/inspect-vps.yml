name: Inspect VPS Environment and Logs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS processes, ports, and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== PM2 Process Status ==="
            pm2 status || true

            echo "=== PM2 Describe satmi-scheduler ==="
            pm2 describe satmi-scheduler || true

            echo "=== satmi-scheduler Out Log (last 60 lines) ==="
            tail -n 60 /home/deployer/logs/satmi-scheduler-out.log 2>/dev/null || true

            echo "=== satmi-scheduler Error Log (last 60 lines) ==="
            tail -n 60 /home/deployer/logs/satmi-scheduler-error.log 2>/dev/null || true

            echo "=== satmi-orders Error Log (last 60 lines) ==="
            tail -n 60 /home/deployer/logs/satmi-orders-error.log 2>/dev/null || true

            echo "=== satmi-orders Out Log (last 40 lines) ==="
            tail -n 40 /home/deployer/logs/satmi-orders-out.log 2>/dev/null || true

            echo "=== Database sync_state ==="
            sudo -u postgres psql -d satmi_orders -c "SELECT key, LEFT(value, 80) as val, updated_at FROM sync_state ORDER BY updated_at DESC LIMIT 25;" || true

            echo "=== Database orders summary ==="
            sudo -u postgres psql -d satmi_orders -c "SELECT COUNT(*) as total_orders, MAX(order_date) as latest_order_date, MAX(synced_at) as latest_synced_at FROM orders;" || true

            echo "=== Test Fast-Sync Curl Local Endpoint ==="
            curl -s -w "\nHTTP_STATUS: %{http_code}\n" -H "x-requested-with: satmi-orders-dashboard" http://127.0.0.1:5001/api/cron/fast-sync || true

