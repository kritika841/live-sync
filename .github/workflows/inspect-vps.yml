name: Inspect VPS Environment and Logs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS processes, ports, and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== PM2 Process Status ==="
            pm2 status || true

            echo "=== PM2 satmi-orders logs ==="
            pm2 logs satmi-orders --lines 80 --nostream || true

            echo "=== PM2 satmi-scheduler logs ==="
            pm2 logs satmi-scheduler --lines 80 --nostream || true

            echo "=== Check orders raw_json anomalies ==="
            sudo -u postgres psql -d satmi_orders -c "SELECT COUNT(*) as null_or_empty_raw_json FROM orders WHERE raw_json IS NULL OR raw_json = '';" || true
            sudo -u postgres psql -d satmi_orders -c "SELECT COUNT(*) as literal_u0000_raw_json FROM orders WHERE raw_json LIKE '%\\\\u0000%';" || true

            echo "=== Test upsert query with proposed SQL ==="
            sudo -u postgres psql -d satmi_orders -c "
              DO \$\$
              DECLARE
                dummy_json text := '{\"id\": 1, \"name\": \"test\"}';
              BEGIN
                -- Test jsonb merge without null byte
                PERFORM (dummy_json::jsonb || '{}'::jsonb)::text;
                RAISE NOTICE 'Basic JSON test PASSED';
              END
              \$\$;
            " || true



