name: Inspect VPS Environment and Logs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS processes, ports, and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "=== PM2 Process Status ==="
            pm2 status || true

            echo "=== satmi-scheduler Out Log (last 20 lines) ==="
            tail -n 20 /home/deployer/logs/satmi-scheduler-out*.log 2>/dev/null || true

            echo "=== satmi-scheduler Error Log (last 10 lines) ==="
            tail -n 10 /home/deployer/logs/satmi-scheduler-error*.log 2>/dev/null || true

            echo "=== Database sync_state ==="
            sudo -u postgres psql -d satmi_orders -c "SELECT key, LEFT(value, 80) as val, updated_at FROM sync_state ORDER BY updated_at DESC LIMIT 15;" || true

            echo "=== Database orders summary ==="
            sudo -u postgres psql -d satmi_orders -c "SELECT COUNT(*) as total_orders, MAX(order_date) as latest_order_date, MAX(synced_at) as latest_synced_at FROM orders;" || true





