# Satmi Orders Dashboard - Nginx Virtual Host Configuration
# Place in /etc/nginx/sites-available/satmi-orders and symlink to /etc/nginx/sites-enabled/
# Replace 'orders.satmi.in' with your chosen domain or subdomain.
# Provision SSL certificate using: certbot --nginx -d orders.satmi.in

server {
    listen 80;
    server_name orders.satmi.in;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
